api_platform:
    title: Notes API
    version: 1.0.0
    formats:
        jsonld: ["application/ld+json"]
        json: ["application/json"]
        html: ["text/html"]
    docs_formats:
        jsonld: ["application/ld+json"]
        jsonopenapi: ["application/vnd.openapi+json"]
        html: ["text/html"]
    defaults:
        pagination_items_per_page: 20
        stateless: true
        cache_headers:
            vary: ["Content-Type", "Authorization", "Origin"]
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
    mapping:
        paths: ["%kernel.project_dir%/src/Entity"]
